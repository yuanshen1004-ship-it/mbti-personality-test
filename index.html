gin:0 0 18px}.insight{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}.insight strong{display:block;margin-bottom:6px;font-size:14px}.insight p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:10px}.secondary{background:#f0edff;color:#5d53bd;box-shadow:none}.secondary:hover{box-shadow:none}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.mode{padding:17px;text-align:left;color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:none}.mode strong,.mode small{display:block}.mode strong{font-size:16px}.mode small{margin-top:6px;color:var(--muted);font-weight:400;line-height:1.5}.mode.selected{border-color:var(--violet);background:#f3f1ff;box-shadow:0 8px 18px rgba(100,84,200,.12)}.mode.selected:after{content:'已选择';float:right;color:var(--violet);font-size:12px}.comparison{margin:0 0 18px;padding:18px;border-radius:17px;background:linear-gradient(135deg,#f5f3ff,#f4fffb)}.comparison h3{margin:0 0 8px;font-size:16px}.comparison p{min-height:24px;margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.65}.comparison select{width:100%;padding:11px 12px;border:1px solid #dedaf6;border-radius:11px;background:#fff;color:var(--ink);font:inherit}.compare-visual{display:grid;gap:9px;margin-top:14px}.compare-row{display:grid;grid-template-columns:66px 1fr 1fr;gap:7px;align-items:center;font-size:12px;color:var(--muted)}.compare-row b{height:7px;border-radius:8px;background:var(--violet)}.compare-row i{height:7px;border-radius:8px;background:#a5d9c9}.stability{margin:4px 0 4px;padding:14px 16px;border-radius:15px;background:linear-gradient(110deg,#f6f4ff,#f1fcf8);font-size:14px;line-height:1.6}.stability strong{color:var(--violet)}.detail{margin:0 0 18px;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.detail summary{padding:16px 18px;cursor:pointer;font-size:14px;font-weight:750}.detail div{padding:0 18px 16px;col   <div class="shell"><header><div class="brand">内在坐标</div><div class="badge">16 型人格风格测试 · V3</div></header><div class="status" id="saveStatus"></div>
    <main>
      <section class="panel" id="intro"><div class="eyebrow">PERSONALITY EXPLORATION</div><h1>更了解，<br>那个真实的你。</h1><p class="lead">选择适合当下的探索方式。想快速获得灵感，或希望更细致地了解自己的偏好，都可以。</p><div class="mode-grid"><button class="mode" data-mode="quick"><strong>简化版 · 约 2 分钟</strong><small>12 道核心题，适合快速探索与分享。</small></button><button class="mode" data-mode="deep"><strong>深度版 · 约 5 分钟</strong><small>32 道情境题，结果维度更稳定、解释更细致。</small></button></div><div class="pills"><span class="pill" id="modeHint">请先选择测试版本</span><span class="pill">自动保存进度</span></div><button id="start" disabled>开始探索 →</button><p class="tiny">本测试仅供自我探索与娱乐参考，不构成心理诊断或专业评估。</p></section>
      <section class="panel hidden" id="quiz" aria-live="polite"><div class="progress-meta"><span id="counter"></span><span id="dimension"></span></div><div class="track"><div class="bar" id="bar"></div></div><h2 class="question" id="question"></h2><div class="scale" id="answers"></div><div class="nav"><button class="ghost" id="back">← 上一题</button><button id="next" disabled>下一题 →</button></div></section>
      <section class="panel hidden" id="result"><div class="eyebrow" id="resultMode">你的探索结果</div><h1 class="result-title" id="typeName"></h1><span class="type" id="typeCode"></span><p class="result-text" id="typeText"></p><div class="stability" id="stability"></div><div class="dimensions" id="dimensions"></div><div class="insights" id="insights"></div><details class="detail" id="detailGuide"><summary>打开我的类型成长手册</summary><div></div></details><div class="comparison"><h3>和另一类型相处</h3><select id="compareType"><option value="">选择朋友、伴侣或同事的类型</option></select><p id="compareText">选择一个类型，查看相处时值得注意的沟通偏好。</p><div class="compare-visual" id="compareVisual"></div></div><div class="actions"><button id="share">生成分享卡片</button><button class="secondary" id="copy">复制测试链接</button><button class="ghost" id="restart">重新测试</button></div><p class="tiny">倾向强度表示本次作答中的偏好程度，并非能力、价值或固定标签。</p></section>

  </div><div class="share-card" id="shareCard"><div class="share-brand">内在坐标 · 人格风格探索</div><h2 id="shareName"></h2><div class="share-code" id="shareCode"></div><p id="shareText"></p></div>
  <script>
    const STORAGE='inner-compass-v2';
    const questions=[
      ['和陌生人一起参加活动时，我通常会主动认识新朋友。','EI','能量方向'],['忙碌一天后，我更喜欢独处来恢复能量。','IE','能量方向'],['在讨论中，我会边说边整理自己的想法。','EI','能量方向'],['我习惯先观察、在心里想清楚后再表达。','IE','能量方向'],['热闹的环境通常会让我感到被激活。','EI','能量方向'],['长时间社交后，即使很开心，我也需要安静一下。','IE','能量方向'],['我常主动把有趣的资讯分享给身边的人。','EI','能量方向'],['我更愿意把重要想法留给少数亲近的人。','IE','能量方向'],

    ];
    const profiles={INTJ:['策略师','独立、好奇，习惯把复杂问题拆解为可实现的长期方案。',['优势','善于建立系统，并将长期愿景转化为具体路径。'],['压力信号','反复被打断或缺乏自主空间时，容易感到消耗。'],['沟通建议','先说核心结论，再补充你的推理过程。']],INTP:['思辨者','好奇而开放，喜欢探究概念背后的原理与可能性。',['优势','能从复杂问题中发现新颖的逻辑连接。'],['压力信号','过多琐碎流程会压缩你的探索空间。'],['沟通建议','给自己留出独立思考与试错的时间。']],ENTJ:['指挥者','目标清晰、果断，擅长把愿景组织成行动。',['优势','推动力强，善于让资源与目标对齐。'],['压力信号','效率长期受阻时，容易变得急切。'],['沟通建议','在推进前，也留意团队成员的节奏。']],ENTP:['探索者','反应敏捷、富有创意，享受挑战既有观点。',['优势','能快速发现替代方案，激发新思路。'],['压力信号','一成不变或没有讨论空间会让你失去动力。'],['沟通建议','为最有价值的点子设一个小的落地期限。']],INFJ:['洞察者','重视意义与连接，善于理解他人的深层需求。',['优势','兼具远见与共情，常能看见他人未说出口的部分。'],['压力信号','长期忽略自身边界时，容易感到疲惫。'],['沟通建议','把自己的需求也像对待他人一样认真表达。']],INFP:['理想主义者','真诚敏感，重视价值观并愿意守护内心热爱。',['优势','价值感强，能为人和事带来真诚的理解。'],['压力信号','环境与内心价值冲突时，会格外消耗。'],['沟通建议','把灵感拆成很小的下一步，更容易开始。']],ENFJ:['引领者','温暖有感召力，乐于支持他人成长。',['优势','擅长凝聚人心，看到每个人的成长潜力。'],['压力信号','过度承担他人期待时，可能忽略自己。'],['沟通建议','支持别人时，也为自己保留充电时间。']],ENFP:['启发者','热情开放，善于发现人和事物中的新可能。',['优势','感染力强，容易为团队带来热情与连接。'],['压力信号','被过多规则限制时，容易感觉受困。'],['沟通建议','用简单的清单保护你真正想完成的事。']],ISTJ:['守序者','踏实可靠，注重细节与承诺。',['优势','责任感强，能稳定地把重要的事做好。'],['压力信号','频繁且无准备的变化会带来压力。'],['沟通建议','提前说明变化的原因与计划会更安心。']],ISFJ:['守护者','细腻体贴，愿意用实际行动照顾他人。',['优势','可靠周到，善于从细节中创造安全感。'],['压力信号','持续付出却不被看见时，容易感到委屈。'],['沟通建议','练习明确提出帮助与支持的需求。']],ESTJ:['执行者','务实直接，擅长建立秩序并推动事情落地。',['优势','执行有力，擅长把模糊目标变成可完成的任务。'],['压力信号','责任边界不清会降低你的效率。'],['沟通建议','给不同风格的人一点适应和反馈空间。']],ESFJ:['协调者','热情周到，重视关系和集体的和谐。',['优势','善于照顾整体氛围，让人感到被接纳。'],['压力信号','关系失衡或反馈冷淡时，容易不安。'],['沟通建议','不必通过满足所有人来证明自己的价值。']],ISTP:['实践者','冷静灵活，喜欢动手解决真实问题。',['优势','面对突发问题时，能迅速找到可行方案。'],['压力信号','被过度管理或重复解释会感到束缚。'],['沟通建议','适时分享你的思路，能减少彼此误解。']],ISFP:['体验者','温和随性，对美感与当下体验保持敏锐。',['优势','有细腻的审美与真诚的感受力。'],['压力信号','强硬冲突或过度催促会令你疲惫。'],['沟通建议','将感受说得更具体，会更容易被理解。']],ESTP:['行动派','大胆敏锐，善于在变化中迅速抓住机会。',['优势','适应力强，敢于把机会变成现实行动。'],['压力信号','长时间等待或纸上谈兵会消耗耐心。'],['沟通建议','在行动前留一点时间核对长期影响。']],ESFP:['表演者','热情有感染力，乐于创造轻松快乐的氛围。',['优势','很会感受当下，也能把快乐带给身边的人。'],['压力信号','被孤立或环境过于冷淡时，会降低能量。'],['沟通建议','为真正重要的目标安排一个可见的进度点。']]};
    const labels=['非常不同意','不同意','不确定','同意','非常同意'];let index=0,answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id),screens=['intro','quiz','result'];
    function show(id){screens.forEach(s=>$(s).classList.toggle('hidden',s!==id))}function persist(){localStorage.setItem(STORAGE,JSON.stringify({index,answers}));$('saveStatus').textContent='进度已自动保存'}function restore(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x?.answers?.length===questions.length){answers=x.answers;index=x.index||0;$('start').textContent=answers.some(v=>v!==null)?'继续探索 →':'开始探索 →'}}catch{}}function render(){const q=questions[index];$('counter').textContent=`第 ${index+1} / ${questions.length} 题`;$('dimension').textContent=q[2];$('bar').style.width=`${(index+1)/questions.length*100}%`;$('question').textContent=q[0];$('back').disabled=index===0;$('next').disabled=answers[index]===null;$('next').textContent=index===questions.length-1?'查看结果 →':'下一题 →';$('answers').innerHTML=labels.map((l,i)=>`<button class="answer ${answers[index]===i+1?'selected':''}" data-v="${i+1}"><i>${i+1}</i><span>${l}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.v;persist();render()})}
