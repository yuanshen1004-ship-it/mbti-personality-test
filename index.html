  <title>内在坐标 · 性格测试</title>
  <style>
    :root{--ink:#20243a;--muted:#72778f;--line:#e8e8f2;--violet:#685ed2;--pink:#ed78ae;--mint:#55bda8;--card:rgba(255,255,255,.82)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(135deg,#f8f3ff 0%,#fff 47%,#eefcf8 100%)}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(10px);opacity:.55}body:before{width:30rem;height:30rem;top:-15rem;left:-10rem;background:#dbcaff}body:after{width:26rem;height:26rem;right:-11rem;bottom:-12rem;background:#b9f2df}.shell{max-width:880px;min-height:100vh;margin:auto;padding:28px 24px 40px;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.08em}.badge{padding:7px 12px;border-radius:99px;background:#eeeaff;color:#5f55bd;font-size:12px}.status{font-size:12px;color:#7f8297;margin-top:12px;min-height:18px}main{flex:1;display:grid;place-items:center}.panel{width:min(100%,720px);background:var(--card);border:1px solid rgba(255,255,255,.9);box-shadow:0 22px 60px rgba(57,45,110,.11);backdrop-filter:blur(12px);border-radius:28px;padding:clamp(28px,6vw,56px)}.hidden{display:none!important}.eyebrow{color:#7369d3;font-size:12px;font-weight:800;letter-spacing:.14em}h1{margin:12px 0 16px;font-size:clamp(34px,6vw,55px);line-height:1.12;letter-spacing:-.055em}.lead,.result-text{color:var(--muted);font-size:16px;line-height:1.85}.pills{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0}.pill{padding:8px 11px;border-radius:12px;background:#f5f3ff;color:#625a9c;font-size:13px}button{appearance:none;border:0;border-radius:14px;padding:15px 21px;color:#fff;cursor:pointer;font:inherit;font-weight:750;background:linear-gradient(110deg,var(--violet),#8c65dc);box-shadow:0 10px 20px rgba(105,83,205,.25);transition:transform .2s,box-shadow .2s}button:hover{transform:translateY(-2px);box-shadow:0 14px 24px rgba(105,83,205, 6px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}.insight strong{display:block;margin-bottom:6px;font-size:14px}.insight p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:10px}.secondary{background:#f0edff;color:#5d53bd;box-shadow:none}.secondary:hover{box-shadow:none}.share-card{position:fixed;left:-10000px;top:0;width:1080px;height:720px;padding:80px;color:#fff;background:radial-gradient(circle at 85% 15%,#f69fc7,transparent 32%),radial-gradient(circle at 7% 90%,#70d9bd,transparent 28%),linear-gradient(135deg,#383174,#7b62d4)}.share-card .share-brand{font-size:25px;font-weight:800;letter-spacing:.08em;opacity:.9}.share-card h2{margin:90px 0 16px;font-size:76px;letter-spacing:-.06em}.share-card p{max-width:650px;font-size:27px;line-height:1.55;opacity:.9}.share-card .share-code{display:inline-block;margin-top:34px;padding:12px 18px;border:1px solid rgba(255,255,255,.45);border-radius:99px;font-weight:800;letter-spacing:.1em;font-size:22px}@media(max-width:520px){.shell{padding:22px 16px}.panel{padding:30px 24px;border-radius:22px}.dimensions{grid-template-columns:1fr}.question{margin:38px 0 24px}.answer{padding:13px}.badge{display:none}}
  </style>
</head>
<body>
  <div class="shell"><header><div class="brand">内在坐标</div><div class="badge">16 型人格风格测试 · V2</div></header><div class="status" id="saveStatus"></div>
    <main>
      <section class="panel" id="intro"><div class="eyebrow">PERSONALITY EXPLORATION</div><h1>更了解，<br>那个真实的你。</h1><p class="lead">32 道情境题，探索你如何获得能量、感知世界、做出决定，以及安排生活。</p><div class="pills"><span class="pill">32 道情境题</span><span class="pill">约 5 分钟</span><span class="pill">自动保存进度</span></div><button id="start">开始探索 →</button><p class="tiny">本测试仅供自我探索与娱乐参考，不构成心理诊断或专业评估。</p></section>
      <section class="panel hidden" id="quiz" aria-live="polite"><div class="progress-meta"><span id="counter"></span><span id="dimension"></span></div><div class="track"><div class="bar" id="bar"></div></div><h2 class="question" id="question"></h2><div class="scale" id="answers"></div><div class="nav"><button class="ghost" id="back">← 上一题</button><button id="next" disabled>下一题 →</button></div></section>
      <section class="panel hidden" id="result"><div class="eyebrow">你的探索结果</div><h1 class="result-title" id="typeName"></h1><span class="type" id="typeCode"></span><p class="result-text" id="typeText"></p><div class="dimensions" id="dimensions"></div><div class="insights" id="insights"></div><div class="actions"><button id="share">生成分享卡片</button><button class="secondary" id="copy">复制测试链接</button><button class="ghost" id="restart">重新测试</button></div><p class="tiny">倾向强度表示本次作答中的偏好程度，并非能力、价值或固定标签。</p></section>
    </main>
  </div><div class="share-card" id="shareCard"><div class="share-brand">内在坐标 · 人格风格探索</div><h2 id="shareName"></h2><div class="share-code" id="shareCode"></div><p id="shareText"></p></div>
  <script>
    const STORAGE='inner-compass-v2';
    const questions=[
      ['和陌生人一起参加活动时，我通常会主动认识新朋友。','EI','能量方向'],['忙碌一天后，我更喜欢独处来恢复能量。','IE','能量方向'],['在讨论中，我会边说边整理自己的想法。','EI','能量方向'],['我习惯先观察、在心里想清楚后再表达。','IE','能量方向'],['热闹的环境通常会让我感到被激活。','EI','能量方向'],['长时间社交后，即使很开心，我也需要安静一下。','IE','能量方向'],['我常主动把有趣的资讯分享给身边的人。','EI','能量方向'],['我更愿意把重要想法留给少数亲近的人。','IE','能量方向'],
      ['我更相信经过验证的事实和实际经验。','SN','信息偏好'],['我常会被“未来有哪些可能性”这样的想法吸引。','NS','信息偏好'],['学习新事物时，清晰的步骤对我很重要。','SN','信息偏好'],['我喜欢把看似无关的点子联系起来。','NS','信息偏好'],['我常留意具体细节是否准确。','SN','信息偏好'],['我对隐藏的模式、象征或言外之意很敏感。','NS','信息偏好'],['我更喜欢立刻有用的信息，而不是抽象理论。','SN','信息偏好'],['我愿意花时间想象一种尚未存在的可能。','NS','信息偏好'],
      ['做决定时，我优先考虑逻辑是否一致、公平有效。','TF','决策方式'],['即使很难，我也会优先顾及决定对他人的感受。','FT','决策方式'],['我觉得坦诚指出问题通常比委婉绕开更有帮助。','TF','决策方式'],['在分歧中，我会先尝试理解每个人在意什么。','FT','决策方式'],['我很自然地分析规则是否合理。','TF','决策方式'],['我容易感受到周围人的情绪变化。','FT','决策方式'],['面对批评时，我会先判断它是否有事实依据。','TF','决策方式'],['我会考虑这句话会不会伤害对方。','FT','决策方式'],
      ['旅行时，我喜欢提前规划好路线与时间安排。','JP','生活节奏'],['面对计划改变，我往往觉得即兴调整也很有趣。','PJ','生活节奏'],['完成待办事项会让我感到轻松踏实。','JP','生活节奏'],['我喜欢保留选择空间，临近时再做决定。','PJ','生活节奏'],['我倾向于提前开始，避免最后一刻的压力。','JP','生活节奏'],['临近截止日期的压力，有时反而能激发我的效率。','PJ','生活节奏'],['整洁有序的环境能让我更专注。','JP','生活节奏'],['我常常根据当下状态调整自己的节奏。','PJ','生活节奏']
    ];
    const profiles={INTJ:['策略师','独立、好奇，习惯把复杂问题拆解为可实现的长期方案。',['优势','善于建立系统，并将长期愿景转化为具体路径。'],['压力信号','反复被打断或缺乏自主空间时，容易感到消耗。'],['沟通建议','先说核心结论，再补充你的推理过程。']],INTP:['思辨者','好奇而开放，喜欢探究概念背后的原理与可能性。',['优势','能从复杂问题中发现新颖的逻辑连接。'],['压力信号','过多琐碎流程会压缩你的探索空间。'],['沟通建议','给自己留出独立思考与试错的时间。']],ENTJ:['指挥者','目标清晰、果断，擅长把愿景组织成行动。',['优势','推动力强，善于让资源与目标对齐。'],['压力信号','效率长期受阻时，容易变得急切。'],['沟通建议','在推进前，也留意团队成员的节奏。']],ENTP:['探索者','反应敏捷、富有创意，享受挑战既有观点。',['优势','能快速发现替代方案，激发新思路。'],['压力信号','一成不变或没有讨论空间会让你失去动力。'],['沟通建议','为最有价值的点子设一个小的落地期限。']],INFJ:['洞察者','重视意义与连接，善于理解他人的深层需求。',['优势','兼具远见与共情，常能看见他人未说出口的部分。'],['压力信号','长期忽略自身边界时，容易感到疲惫。'],['沟通建议','把自己的需求也像对待他人一样认真表达。']],INFP:['理想主义者','真诚敏感，重视价值观并愿意守护内心热爱。',['优势','价值感强，能为人和事带来真诚的理解。'],['压力信号','环境与内心价值冲突时，会格外消耗。'],['沟通建议','把灵感拆成很小的下一步，更容易开始。']],ENFJ:['引领者','温暖有感召力，乐于支持他人成长。',['优势','擅长凝聚人心，看到每个人的成长潜力。'],['压力信号','过度承担他人期待时，可能忽略自己。'],['沟通建议','支持别人时，也为自己保留充电时间。']],ENFP:['启发者','热情开放，善于发现人和事物中的新可能。',['优势','感染力强，容易为团队带来热情与连接。'],['压力信号','被过多规则限制时，容易感觉受困。'],['沟通建议','用简单的清单保护你真正想完成的事。']],ISTJ:['守序者','踏实可靠，注重细节与承诺。',['优势','责任感强，能稳定地把重要的事做好。'],['压力信号','频繁且无准备的变化会带来压力。'],['沟通建议','提前说明变化的原因与计划会更安心。']],ISFJ:['守护者','细腻体贴，愿意用实际行动照顾他人。',['优势','可靠周到，善于从细节中创造安全感。'],['压力信号','持续付出却不被看见时，容易感到委屈。'],['沟通建议','练习明确提出帮助与支持的需求。']],ESTJ:['执行者','务实直接，擅长建立秩序并推动事情落地。',['优势','执行有力，擅长把模糊目标变成可完成的任务。'],['压力信号','责任边界不清会降低你的效率。'],['沟通建议','给不同风格的人一点适应和反馈空间。']],ESFJ:['协调者','热情周到，重视关系和集体的和谐。',['优势','善于照顾整体氛围，让人感到被接纳。'],['压力信号','关系失衡或反馈冷淡时，容易不安。'],['沟通建议','不必通过满足所有人来证明自己的价值。']],ISTP:['实践者','冷静灵活，喜欢动手解决真实问题。',['优势','面对突发问题时，能迅速找到可行方案。'],['压力信号','被过度管理或重复解释会感到束缚。'],['沟通建议','适时分享你的思路，能减少彼此误解。']],ISFP:['体验者','温和随性，对美感与当下体验保持敏锐。',['优势','有细腻的审美与真诚的感受力。'],['压力信号','强硬冲突或过度催促会令你疲惫。'],['沟通建议','将感受说得更具体，会更容易被理解。']],ESTP:['行动派','大胆敏锐，善于在变化中迅速抓住机会。',['优势','适应力强，敢于把机会变成现实行动。'],['压力信号','长时间等待或纸上谈兵会消耗耐心。'],['沟通建议','在行动前留一点时间核对长期影响。']],ESFP:['表演者','热情有感染力，乐于创造轻松快乐的氛围。',['优势','很会感受当下，也能把快乐带给身边的人。'],['压力信号','被孤立或环境过于冷淡时，会降低能量。'],['沟通建议','为真正重要的目标安排一个可见的进度点。']]};
    const labels=['非常不同意','不同意','不确定','同意','非常同意'];let index=0,answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id),screens=['intro','quiz','result'];
    function show(id){screens.forEach(s=>$(s).classList.toggle('hidden',s!==id))}function persist(){localStorage.setItem(STORAGE,JSON.stringify({index,answers}));$('saveStatus').textContent='进度已自动保存'}function restore(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x?.answers?.length===questions.length){answers=x.answers;index=x.index||0;$('start').textContent=answers.some(v=>v!==null)?'继续探索 →':'开始探索 →'}}catch{}}function render(){const q=questions[index];$('counter').textContent=`第 ${index+1} / ${questions.length} 题`;$('dimension').textContent=q[2];$('bar').style.width=`${(index+1)/questions.length*100}%`;$('question').textContent=q[0];$('back').disabled=index===0;$('next').disabled=answers[index]===null;$('next').textContent=index===questions.length-1?'查看结果 →':'下一题 →';$('answers').innerHTML=labels.map((l,i)=>`<button class="answer ${answers[index]===i+1?'selected':''}" data-v="${i+1}"><i>${i+1}</i><span>${l}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.v;persist();render()})}
    function values(){const c={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};questions.forEach((q,i)=>{let n=answers[i]-3,[a,b]=q[1];if(n>=0)c[a]+=n;else c[b]-=n});return c}function getCode(){let c=values();return[['E','I'],['S','N'],['T','F'],['J','P']].map(([a,b])=>c[a]>=c[b]?a:b).join('')}function result(){const code=getCode(),p=profiles[code],c=values();$('typeName').textContent=p[0];$('typeCode').textContent=code;$('typeText').textContent=p[1];const pairs=[['E','I','能量方向'],['S','N','信息偏好'],['T','F','决策方式'],['J','P','生活节奏']];$('dimensions').innerHTML=pairs.map(([a,b,l])=>{let total=c[a]+c[b]||1,w=c[a]>=c[b]?a:b,pct=Math.round(Math.max(c[a],c[b])/total*100);return`<div class="dimension"><label>${l}<span>偏 ${w} · ${pct}%</span></label><div class="meter"><b style="width:${pct}%"></b></div></div>`}).join('');$('insights').innerHTML=p.slice(2).map(x=>`<div class="insight"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('');$('shareName').textContent=p[0];$('shareCode').textContent=code;$('shareText').textContent=p[1];localStorage.removeItem(STORAGE);$('saveStatus').textContent='测试完成';show('result')}
    $('start').onclick=()=>{show('quiz');render()};$('back').onclick=()=>{if(index){index--;render()}};$('next').onclick=()=>{if(index===questions.length-1)result();else{index++;render()}};$('restart').onclick=()=>{index=0;answers.fill(null);$('saveStatus').textContent='';show('intro');$('start').textContent='开始探索 →'};$('copy').onclick=async()=>{await navigator.clipboard.writeText(location.href);$('copy').textContent='链接已复制 ✓';setTimeout(()=>$('copy').textContent='复制测试链接',1600)};$('share').onclick=async()=>{try{const canvas=await renderCard();const url=canvas.toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download='我的内在坐标.png';a.click()}catch{$('share').textContent='可截图分享结果';setTimeout(()=>$('share').textContent='生成分享卡片',1600)}};async function renderCard(){const el=$('shareCard'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=720;let grad=ctx.createLinearGradient(0,0,1080,720);grad.addColorStop(0,'#393176');grad.addColorStop(1,'#8762da');ctx.fillStyle=grad;ctx.fillRect(0,0,1080,720);ctx.fillStyle='#ffffff';ctx.font='800 25px Microsoft YaHei';ctx.fillText('内在坐标 · 人格风格探索',80,105);ctx.font='800 76px Microsoft YaHei';ctx.fillText($('shareName').textContent,80,235);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.strokeRect(80,275,180,58);ctx.font='800 24px Microsoft YaHei';ctx.fillText($('shareCode').textContent,108,314);ctx.font='27px Microsoft YaHei';wrap(ctx,$('shareText').textContent,80,410,680,46);ctx.font='20px Microsoft YaHei';ctx.fillText('inner compass · 发现你的偏好风格',80,650);return canvas}function wrap(ctx,text,x,y,max,w){let line='';for(const char of text){if(ctx.measureText(line+char).width>max){ctx.fillText(line,x,y);line=char;y+=w}else line+=char}ctx.fillText(line,x,y)}restore();
  </script>
